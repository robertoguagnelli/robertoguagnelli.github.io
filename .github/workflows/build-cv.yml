name: Build CV PDF

on:
  push:
    branches: [main]
    paths:
      - 'assets/Roberto_Guagnelli_CV.tex'
      - '.github/workflows/build-cv.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Roberto_Guagnelli_CV.tex
          working_directory: assets

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Roberto_Guagnelli_CV.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "Rebuild CV PDF from LaTeX"
            git push
          fi
